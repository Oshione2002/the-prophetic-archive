name: the_prophetic_archive
description: "Offline-first research and reading library for the Neal Frisby archive."
publish_to: none
version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  audioplayers: ^6.8.1
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  disk_space_2: ^1.0.11
  drift: ^2.34.3
  flutter_riverpod: ^3.4.2
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.4.7
  sqlite3: ^3.5.1
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4Variable-Roman.ttf
        - asset: assets/fonts/SourceSerif4Variable-Italic.ttf
          style: italic
