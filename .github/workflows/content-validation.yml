name: Content Validation

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'tool/content_pipeline/**'
      - 'lib/core/domain/archive_models.dart'
      - 'test/catalogue_test.dart'
      - 'test/content_validation_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - run: flutter pub get
      - name: Validate the published authentic content repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dart run tool/content_pipeline/main.dart --validate-only
      - run: flutter test test/catalogue_test.dart test/content_validation_test.dart
